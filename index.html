<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Productivity Dashboard</title>
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- End of Bootstrap section -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Shiva Thapa for the WEB-115 course at Wake Tech.</p>
    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.")
    </script>
    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript>
        Unfortunately, your web browser does not support JavaScript.
    </noscript>
    <div class="container">
    <div class="row">
        <!-- Dashboard Content -->
    </div>
    <div class="col" id="weekly-tasks">
        <script src="js/task-manager.js"></script>
        <form>

            <!--1. Name Input -->
            <div>
            <label for="userName">Enter your name: </label>
            <input type="text" id="userName" name="name">
            </div>

            <!--Daily Task Goal -->
            <div>
            <label for="dailyGoal">Enter your daily task goal: </label>
            <input type="number" id="dailyGoal" name="dailygoal">
            </div>

            <!--3. Weekly Bonus Task -->
            <div>
            <label for="bonusTasks">Enter your weekly bonus task: </label>
            <input type="number" id="bonusTasks" name="weekly-bonus-task">
            </div>    

            <!--Goal Button-->   
            <button id="goal-btn">Goals</button>   
              
        </form>
        <p id="goal-message"></p>
    </div>
    </div>
</body>

</html>
